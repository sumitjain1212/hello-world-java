name: Build the java project

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Build with Maven
      - name: Build with Maven
        run: mvn clean install

      # Step 4: Run tests
      - name: Run tests
        run: mvn test

      # Step 5: Copy artifacts (WAR/JAR)
      - name: Copy artifacts
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          cp target/*.war ${{ github.workspace }}/artifacts/ || true
          cp target/*.jar ${{ github.workspace }}/artifacts/ || true

      # Step 6: Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: java-artifacts
          path: ${{ github.workspace }}/artifacts/

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 7: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/java-app:latest

      # Step 8: Run Docker container
      - name: Run Docker container
        run: docker run -d -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/java-app:latest
